  <line x1="78" y1="124" x2="186" y2="124" stroke="#cbd5e1" stroke-width="1"/>

  <text x="24" y="150" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#6B7280">DATE:</text>
